name: Android CI

on:
  push:
    branches: [feat/streamz-phase-1a, v2.x.x]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Must go up with every APK that is meant to be installable over the last one, and it has to
      # end up higher than what is already on a phone before `releasePolicy/latest` can offer this
      # build as an update: `decideUpdate` compares against the installed version, and an APK that
      # is not newer is correctly reported as "up to date" and never installed.
      APP_VERSION: '0.1.2'
      ANDROID_VERSION_CODE: '3'
    steps:
      - uses: actions/checkout@v4

      # The 2026-10-08 run died with "No space left on device": RN release
      # intermediates, Gradle caches and node_modules overflow the default
      # runner disk when debug AND release are both built. Clear the
      # preinstalled toolchains this project does not use, and build release
      # only — a debug APK for Metro-based development is produced on a dev
      # machine, the standalone test APK is release.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v4

      - name: Install JS dependencies
        run: npm ci

      # SDK 57 inlines EXPO_PUBLIC_* into the JS bundle at build time, so the
      # content-engine keys must exist here. They come from the same repo
      # secrets build.yml already uses; a missing key is simply omitted and
      # the app falls back to its documented defaults / disabled feature.
      - name: Write .env
        env:
          EXPO_PUBLIC_TMDB_API_KEY: ${{ secrets.EXPO_PUBLIC_TMDB_API_KEY }}
          EXPO_PUBLIC_TMDB_BASE_URL: ${{ secrets.EXPO_PUBLIC_TMDB_BASE_URL }}
          EXPO_PUBLIC_TMDB_IMAGE_BASE_URL: ${{ secrets.EXPO_PUBLIC_TMDB_IMAGE_BASE_URL }}
          EXPO_PUBLIC_WYZIE_BASE_URL: ${{ secrets.EXPO_PUBLIC_WYZIE_BASE_URL }}
          EXPO_PUBLIC_WYZIE_API_KEY: ${{ secrets.EXPO_PUBLIC_WYZIE_API_KEY }}
          EXPO_PUBLIC_WATCH_PARTY_URL: ${{ secrets.EXPO_PUBLIC_WATCH_PARTY_URL }}
        run: |
          umask 077
          {
            printf 'APP_VERSION=%s\n' "$APP_VERSION"
            printf 'ANDROID_VERSION_CODE=%s\n' "$ANDROID_VERSION_CODE"
            printf 'EXPO_PUBLIC_TMDB_BASE_URL=%s\n' "${EXPO_PUBLIC_TMDB_BASE_URL:-https://api.themoviedb.org/3}"
            printf 'EXPO_PUBLIC_TMDB_IMAGE_BASE_URL=%s\n' "${EXPO_PUBLIC_TMDB_IMAGE_BASE_URL:-https://image.tmdb.org/t/p/w500}"
            printf 'EXPO_PUBLIC_WYZIE_BASE_URL=%s\n' "${EXPO_PUBLIC_WYZIE_BASE_URL:-https://sub.wyzie.io}"
            printf 'EXPO_PUBLIC_UPDATE_REPO_OWNER=mir-majid01\n'
            printf 'EXPO_PUBLIC_UPDATE_REPO_NAME=StreamZ\n'
            for k in EXPO_PUBLIC_TMDB_API_KEY EXPO_PUBLIC_WYZIE_API_KEY EXPO_PUBLIC_WATCH_PARTY_URL; do
              eval "v=\${$k}"
              if [ -n "$v" ]; then printf '%s=%s\n' "$k" "$v"; fi
            done
          } > .env

      # Release signing is intentionally fail-closed. The keystore is decoded
      # outside the workspace and exists only for the Gradle invocation.
      - name: Prepare release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${RELEASE_KEYSTORE_BASE64:?RELEASE_KEYSTORE_BASE64 is required for assembleRelease}"
          : "${RELEASE_KEYSTORE_PASSWORD:?RELEASE_KEYSTORE_PASSWORD is required for assembleRelease}"
          : "${RELEASE_KEY_ALIAS:?RELEASE_KEY_ALIAS is required for assembleRelease}"
          : "${RELEASE_KEY_PASSWORD:?RELEASE_KEY_PASSWORD is required for assembleRelease}"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/streamz-release.keystore"
          test -s "$RUNNER_TEMP/streamz-release.keystore"

      # The committed android/gradle.properties caps the JVM heap at what this
      # project's 3.9 GB dev machine can spare; the runner has room for more and
      # D8 needs it to finish the release bundle.
      - name: Assemble release APK
        working-directory: android
        env:
          STREAMZ_RELEASE_STORE_FILE: ${{ runner.temp }}/streamz-release.keystore
          STREAMZ_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          STREAMZ_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          STREAMZ_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs=-Xmx3072m \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/streamz-release.keystore"

      # P20: a release policy is only meaningful if the checksum describes the exact
      # bytes this run produced. `sha256sum` streams the file, so a ~40 MB APK never
      # has to be loaded into JavaScript memory, and the step refuses to continue if
      # the digest is missing, the wrong length, or not hex — a placeholder or a
      # copied-out value from an earlier release is how a stale checksum ships.
      - name: Digest the APK this run built
        id: apk_digest
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -s "$APK" ]; then
            echo "::error::no APK at $APK — refusing to publish a checksum"
            exit 1
          fi
          DIGEST="$(sha256sum "$APK" | awk '{print $1}')"
          case "$DIGEST" in
            ''|*[!0-9a-f]*)
              echo "::error::digest is not 64 lowercase hex characters: '$DIGEST'"
              exit 1
              ;;
          esac
          if [ "${#DIGEST}" -ne 64 ]; then
            echo "::error::digest has length ${#DIGEST}, expected 64"
            exit 1
          fi
          BYTES="$(stat -c %s "$APK")"
          printf '%s  app-release.apk\n' "$DIGEST" > "$APK.sha256"
          printf 'sha256=%s\nbytes=%s\n' "$DIGEST" "$BYTES" >> "$GITHUB_OUTPUT"
          echo "built APK sha256=$DIGEST size=$BYTES"

      # The checksum records the bare file name so it stays usable next to the APK, and
      # `sha256sum -c` resolves names against the working directory, so it has to run there.
      - name: Verify the digest file this run produced
        run: |
          set -euo pipefail
          cd android/app/build/outputs/apk/release
          sha256sum -c app-release.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: streamz-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error

      # Kept in its own artifact so the checksum cannot be swapped for another run's:
      # both names carry the same run number, and a build that produced no digest
      # fails here instead of shipping an unverifiable APK.
      - uses: actions/upload-artifact@v4
        with:
          name: streamz-release-${{ github.run_number }}-sha256
          path: android/app/build/outputs/apk/release/app-release.apk.sha256
          retention-days: 30
          if-no-files-found: error

  verify:
    name: Tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # The job has been named "Tests and typecheck" while only typechecking
      # functions/. Metro strips types without checking them, so an app-wide type
      # error could reach an APK unnoticed. This is the check the name promised.
      - name: Typecheck the app
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest --ci --maxWorkers=2

      - name: Firestore security rules tests
        run: npx firebase-tools emulators:exec --only firestore "npx jest -c jest.emulator.config.js --ci --forceExit"

      - name: Typecheck Cloud Functions
        working-directory: functions
        run: npm ci && npx tsc --noEmit
