<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StreamZ Settings</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;background:#070506}
.ns{scrollbar-width:none}
.ns::-webkit-scrollbar{display:none}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.rise{opacity:0;animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards}
.live{animation:blink 2.4s ease-in-out infinite}
.row{transition:background .18s ease}
.row:hover{background:#18181c}
.row:active{background:#1e1e23}
.row:focus-visible,.nv:focus-visible,.acct:focus-visible{outline:2px solid #FF3B52;outline-offset:-2px}
.row .chev{transition:transform .2s ease,stroke .2s}
.row:hover .chev{transform:translateX(3px);stroke:#fff}
.acct{transition:border-color .2s,transform .18s}
.acct:hover{border-color:#3a2327}
.acct:active{transform:scale(.985)}
.nv{text-decoration:none;transition:color .2s}
.nv:hover{color:#E4E4E9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rise{opacity:1!important}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#070506;color:#fff;font-family:'DM Sans',sans-serif;display:flex;flex-direction:column">
<div style="position:absolute;right:-120px;top:-160px;width:420px;height:420px;background:radial-gradient(closest-side,rgba(255,45,70,.16),rgba(255,45,70,0) 72%);pointer-events:none"></div>
<div class="ns" style="position:relative;flex:1;min-height:0;overflow-y:auto;padding:52px 20px 24px">
<h1 class="rise" style="margin:0;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:34px;letter-spacing:-.025em;line-height:1.05">Settings</h1>

<a class="acct rise" href="#account" style="animation-delay:.08s;margin-top:22px;display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:linear-gradient(180deg,#151518,#0f0f12);border:1px solid #232329;text-decoration:none;color:#fff">
<div style="flex:none;width:46px;height:46px;border-radius:15px;background:#fff;display:flex;align-items:center;justify-content:center">
<svg width="22" height="22" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2045c0-.6381-.0573-1.2518-.1636-1.8409H9v3.4814h4.8436c-.2086 1.125-.8427 2.0782-1.7959 2.7164v2.2581h2.9087c1.7018-1.5668 2.6836-3.874 2.6836-6.615z"></path><path fill="#34A853" d="M9 18c2.43 0 4.4673-.806 5.9564-2.1805l-2.9087-2.2581c-.8059.54-1.8368.859-3.0477.859-2.344 0-4.3282-1.5831-5.036-3.7104H.9574v2.3318C2.4382 15.9832 5.4818 18 9 18z"></path><path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.2822-1.1168-.2822-1.71s.1023-1.17.2823-1.71V4.9582H.9573A8.9965 8.9965 0 0 0 0 9c0 1.4523.3477 2.8268.9573 4.0418L3.964 10.71z"></path><path fill="#EA4335" d="M9 3.5795c1.3214 0 2.5077.4541 3.4405 1.346l2.5813-2.5814C13.4632.8918 11.426 0 9 0 5.4818 0 2.4382 2.0168.9573 4.9582L3.964 7.29C4.6718 5.1627 6.6559 3.5795 9 3.5795z"></path></svg>
</div>
<div style="flex:1;min-width:0">
<div style="font-size:16px;font-weight:600">Google account</div>
<div style="margin-top:5px;display:flex;align-items:center;gap:7px;font-size:13px;color:#A1A1AA"><span class="live" style="width:6px;height:6px;border-radius:3px;background:#2EDC8C"></span>Subscription active · 30 days left</div>
</div>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B8B94" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div class="rise" style="animation-delay:{{g.delay}};margin-top:26px">
<div style="padding:0 6px 10px;font-size:11px;letter-spacing:.2em;font-weight:600;color:#8B8B94">{{g.title}}</div>
<div style="border-radius:22px;background:#111114;border:1px solid #1f1f25;overflow:hidden">
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
<a class="row" href="#row" style="display:flex;align-items:center;gap:14px;padding:14px 16px;text-decoration:none;color:#fff;border-top:{{r.border}}">
<span style="flex:none;width:38px;height:38px;border-radius:12px;background:#1a1a1f;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E4E4E9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"></path></svg></span>
<span style="flex:1;min-width:0">
<span style="display:block;font-size:16px;font-weight:500;line-height:1.25">{{r.title}}</span>
<span style="display:block;margin-top:3px;font-size:13px;line-height:1.3;color:#8B8B94;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{r.sub}}</span>
</span>
<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b6b74" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</a>
</sc-for>
</div>
</div>
</sc-for>

<div class="rise" style="animation-delay:.5s;margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:8px">
<svg viewBox="0 0 64 64" width="26" height="26" aria-hidden="true"><g transform="translate(-2 2)" opacity=".55"><rect x="10" y="14" width="34" height="8" rx="2" fill="#fff"></rect><path d="M44 10 L58 18 L44 26 Z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"></path><path d="M50 24 L14 42" stroke="#FF3B52" stroke-width="8" stroke-linecap="round" fill="none"></path><rect x="10" y="42" width="44" height="8" rx="2" fill="#fff"></rect></g></svg>
<div style="font-size:12px;color:#6b6b74;letter-spacing:.04em">StreamZ v0.1.0</div>
</div>
</div>

<nav aria-label="Main" style="flex:none;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:76px;background:rgba(10,10,12,.96);border-top:1px solid #1a1a1f">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a class="nv" href="{{n.href}}" style="position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:500;color:{{n.color}}">
<span style="position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:#FF3B52;opacity:{{n.bar}}"></span>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.d}}"></path></svg>{{n.label}}</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const B = '1px solid #1c1c21';
const mk = (rows) => rows.map((r, i) => ({ title: r[0], sub: r[1], d: r[2], border: i === 0 ? '0' : B }));
const groups = [
{ title: 'PLAYBACK', delay: '.16s', rows: mk([
['Playback server', 'Streamflix', 'M5 4h14a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1zM5 13h14a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1zM8 7.5h.01M8 16.5h.01'],
['Video quality', 'Preferred: Auto', 'M3 5h18v11H3zM9 20h6M12 16v4M10.5 8.5l4 2-4 2z'],
['Video aspect', 'Contain', 'M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3M8 9h8v6H8z'],
['Subtitles', 'Default: English', 'M3 6h18v12H3zM7 11h4M13 11h4M7 14.5h2M12 14.5h5'],
['Buffering', '120s · Auto · 7.3 GB RAM', 'M4 17a9 9 0 1 1 16 0M12 14l3.5-4']
]) },
{ title: 'LIBRARY', delay: '.24s', rows: mk([

['My List', '0 saved', 'M6 3h12v18l-6-4-6 4z'],
['Finished movies', '0 completed', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM8 12.5l3 3 5-6']
]) },
{ title: 'ABOUT', delay: '.32s', rows: mk([
['Disclaimer', 'About content sources & third-party servers', 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 11v5M12 8h.01'],
['About', 'Credits, licence, privacy and support', 'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z']
]) }
];
const N = [['Home','M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z','Home.dc.html'],['Search','M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4','#search'],['Live','M12 11a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM8.5 8a5 5 0 0 0 0 7M15.5 8a5 5 0 0 1 0 7M5.5 5.5a9 9 0 0 0 0 12M18.5 5.5a9 9 0 0 1 0 12','#live'],['Downloads','M12 4v11M7 11l5 5 5-5M5 20h14','#downloads'],['Settings','M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM19.4 13a7.7 7.7 0 0 0 0-2l2-1.5-2-3.5-2.3 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.6 7.6 0 0 0-1.7 1l-2.3-1-2 3.5 2 1.5a7.7 7.7 0 0 0 0 2l-2 1.5 2 3.5 2.3-1a7.6 7.6 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 1.7-1l2.3 1 2-3.5z','Settings.dc.html']];
return {
groups,
nav: N.map((n, i) => ({ label: n[0], d: n[1], href: n[2], color: i === 4 ? '#FF3B52' : '#8B8B94', bar: i === 4 ? 1 : 0 }))
};
}
}
</script>
</body>
</html>
